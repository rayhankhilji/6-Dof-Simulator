[project]
name = "sixdof"
version = "0.1.0"
description = "6-DOF reusable rocket flight simulator with autonomous landing GNC, Monte Carlo dispersion analysis and ML success prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sixdof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
